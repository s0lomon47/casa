[build]
  publish = "."
  command = "node scripts/gerar-config.js"

# O service worker e a configuração sempre na versão mais nova
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/js/app.js"
  [headers.values]
    Cache-Control = "no-cache"
